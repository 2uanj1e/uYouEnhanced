name: Codex playback repair build

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: Existing YouTube IPA input URL
        required: true
        type: string
      youtube_sha256:
        description: Expected SHA-256 of the verified input IPA
        required: true
        type: string
      input_tag:
        description: Optional temporary draft release containing the verified input IPA
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: codex-playback-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      THEOS: ${{ github.workspace }}/theos
      SDK_VERSION: '18.6'
      UYOU_VERSION: '3.0.4'
      YOUTUBE_VERSION: '21.14.4'
    steps:
      - name: Checkout repair source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: source
          submodules: recursive
          persist-credentials: false

      - name: Checkout Theos
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: theos/theos
          ref: 5280bd038207e14f8bd76f5417aa2fe641c03228
          path: theos
          submodules: recursive
          persist-credentials: false

      - name: Checkout iOS SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: aricloverALT/sdks
          ref: 1b92ff4a8928f582876e1d388d1381c6a0c59eb9
          path: sdk-source
          sparse-checkout: iPhoneOS18.6.sdk
          persist-credentials: false

      - name: Checkout Theos Jailed
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: qnblackcat/theos-jailed
          ref: 662fd704aed27b8956bcfe52a35e2b676921ab42
          path: theos-jailed
          persist-credentials: false

      - name: Checkout optool
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: alexzielenski/optool
          ref: 2898b51da0c0f2f5d7302af5ec82b858ebd4013c
          path: optool-source
          submodules: recursive
          persist-credentials: false

      - name: Prepare build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid dpkg make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          mkdir -p "$THEOS/sdks" "$GITHUB_WORKSPACE/artifacts"
          mv sdk-source/iPhoneOS18.6.sdk "$THEOS/sdks/"
          ./theos-jailed/install
          clang -fobjc-arc -fmodules -framework Foundation \
            -Ioptool-source/optool/FSArgumentParser/ArgumentParser \
            optool-source/optool/*.m optool-source/optool/FSArgumentParser/ArgumentParser/*.m \
            -o "$GITHUB_WORKSPACE/optool-built" > artifacts/optool-build.log 2>&1
          echo "OPTOOL=$GITHUB_WORKSPACE/optool-built" >> "$GITHUB_ENV"

      - name: Download and clean verified input IPA
        shell: bash
        env:
          YOUTUBE_URL: ${{ inputs.youtube_url }}
          YOUTUBE_SHA256: ${{ inputs.youtube_sha256 }}
          INPUT_TAG: ${{ inputs.input_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "::add-mask::$YOUTUBE_URL"
          python3 source/Scripts/codex-build-playback.py prepare

      - name: Build and verify baseline IPA
        run: python3 source/Scripts/codex-build-playback.py baseline

      - name: Incrementally build and verify playback repair IPA
        run: python3 source/Scripts/codex-build-playback.py modified

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uYouEnhanced-playback-${{ github.run_id }}
          path: artifacts/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
