name: Codex current uYouEnhanced playback repair

on:
  workflow_dispatch:
    inputs:
      input_release_tag:
        description: Temporary private draft release containing yt-uYE-21204-305.ipa
        required: true
        type: string
      youtube_sha256:
        description: Expected SHA-256 of the audited 21.20.4 input (recipe rejects other inputs)
        required: true
        default: cdc908526c21acd083256b3cb8902db5841dcc5747337b9bea301894202a1d72
        type: string

permissions:
  contents: read

concurrency:
  group: codex-playback-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      THEOS: ${{ github.workspace }}/theos
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      SDK_VERSION: '26.5'
      UYOU_VERSION: '3.0.4'
      YOUTUBE_VERSION: '21.20.4'
    steps:
      - name: Verify matching Xcode 26.5 toolchain before building
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          {
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            xcrun --find clang
            xcrun clang --version
          } | tee "$GITHUB_WORKSPACE/artifacts/toolchain-verification.txt"
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.5"
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "26.5"

      - name: Checkout repair source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: source
          submodules: recursive
          persist-credentials: false

      - name: Checkout pinned Theos
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: theos/theos
          ref: 5280bd038207e14f8bd76f5417aa2fe641c03228
          path: theos
          submodules: recursive
          persist-credentials: false

      - name: Checkout pinned iOS 26.5 SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: aricloverALT/sdks
          ref: ad607cb07fe4ad1c9b91cf970bd228c2a9253207
          path: sdk-source
          sparse-checkout: iPhoneOS26.5.sdk
          persist-credentials: false

      - name: Checkout pinned Theos Jailed
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: qnblackcat/theos-jailed
          ref: 662fd704aed27b8956bcfe52a35e2b676921ab42
          path: theos-jailed
          persist-credentials: false

      - name: Prepare build tools without installing any app
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid dpkg make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          mkdir -p "$THEOS/sdks" "$GITHUB_WORKSPACE/artifacts"
          mv sdk-source/iPhoneOS26.5.sdk "$THEOS/sdks/"
          ./theos-jailed/install
          python3 source/Scripts/codex-fix-jailed.py

      - name: Test actual source hooks using Foundation doubles
        shell: bash
        run: |
          set -euo pipefail
          python3 source/Tests/run-playback-regression.py --report "$GITHUB_WORKSPACE/artifacts/playback-regression.json"

      - name: Prepare verified private input and retain eight FFmpeg frameworks
        shell: bash
        env:
          YOUTUBE_SHA256: ${{ inputs.youtube_sha256 }}
          INPUT_TAG: ${{ inputs.input_release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 source/Scripts/codex-build-playback.py prepare

      - name: Build and verify baseline IPA
        run: python3 source/Scripts/codex-build-playback.py baseline

      - name: Incrementally build and verify playback repair IPA
        run: python3 source/Scripts/codex-build-playback.py modified

      # No actions/upload-artifact step: IPA output must not become a public-repo artifact.
      # The caller downloads, verifies, and deletes this temporary private draft after handoff.
      - name: Return results only to the existing private draft release
        if: always()
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.input_release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -d "$GITHUB_WORKSPACE/artifacts" ]; then
            echo "No diagnostic/output directory was produced; preserving the original job result."
            exit 0
          fi
          shopt -s nullglob
          files=("$GITHUB_WORKSPACE"/artifacts/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No diagnostic/output files were produced; preserving the original job result."
            exit 0
          fi
          test "$(gh release view "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release upload "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          printf 'Results stored only in the existing private draft `%s`; download/verify/delete it after this run.\n' "$INPUT_TAG" >> "$GITHUB_STEP_SUMMARY"
